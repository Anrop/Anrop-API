services:
  rails:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    image: anrop/anrop-api
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: anrop
      MYSQL_TEST_DATABASE: anrop_test
    links:
      - mysql
    ports:
      - "3000:3000"
    volumes:
      - .:/anrop
  mysql:
    image: mariadb:10.11.19
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anrop
    ports:
      - "3306:3306"
